<!DOCTYPE html>

<html lang="zh-CN">
<head>
  <title>Y&M ACU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #fff;
      padding: 0;
    }

    /* 自适应主容器（只改这里） */
    .acu-container {
      background: #1a1a1a;
      min-height: 100vh;
      padding: 24px;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* 标题区 */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      color: #ff9800;
      font-size: clamp(32px, 10vw, 48px);
      font-weight: 800;
      letter-spacing: 2px;
    }

    .version {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 8px;
    }

    /* MAF 大卡片（自适应） */
    .maf-card {
      background: #0a0a0a;
      border-radius: 24px;
      padding: clamp(30px, 8vw, 40px) clamp(24px, 6vw, 32px);
      margin-bottom: 40px;
      border: 1px solid #252525;
      width: 100%;
    }

    /* MAF 数值 */
    .maf-value {
      font-size: clamp(28px, 8vw, 44px);
      font-weight: 500;
      color: #fff;
      font-family: 'Consolas', monospace;
      letter-spacing: 4px;
      text-shadow: 
        2px 0 0 rgba(255,0,0,0.3),
        -2px 0 0 rgba(0,255,255,0.3);
      margin-bottom: 32px;
    }

    /* 进度条容器（自适应高度） */
    .maf-progress-container {
      width: 100%;
      height: clamp(60px, 15vw, 80px);
      background: #333;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .maf-progress-bar {
      height: 100%;
      width: 85.1%;
      background: linear-gradient(90deg, #4caf50, #ff9800, #f44336);
      transition: width 0.1s ease;
    }

    /* 刻度 */
    .maf-scale {
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
    }

    .scale-item {
      font-size: clamp(16px, 4vw, 18px);
      color: #666;
      font-weight: 600;
      font-family: 'Consolas', monospace;
      text-shadow: 
        1px 0 0 rgba(255,0,0,0.2),
        -1px 0 0 rgba(0,255,255,0.2);
    }

    /* 下方参数列表 */
    .data-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 32px;
    }

    .data-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(16px, 5vw, 20px);
    }

    .data-label {
      color: #ddd;
      font-weight: 500;
    }

    .data-value {
      color: #fff;
      font-weight: 700;
      font-family: 'Consolas', monospace;
      font-size: clamp(16px, 5vw, 22px);
    }

    /* 按钮区 */
    .btn-group {
      display: flex;
      gap: clamp(10px, 4vw, 16px);
      margin-bottom: 32px;
    }

    button {
      flex: 1;
      padding: clamp(14px, 5vw, 20px);
      border: none;
      border-radius: 16px;
      font-size: clamp(14px, 4vw, 20px);
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-start {
      background-color: #0a9d58;
    }

    .btn-stop {
      background-color: #991a2c;
      opacity: 0.7;
    }

    /* 底部状态栏 */
    .status-bar {
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="acu-container">
    <div class="header">
      <h1>Y&M ACU</h1>
      <p class="version">Advanced Control Unit v4.0</p>
    </div>

    <div class="maf-card">
      <div class="maf-value">MAF: 85.1</div>
      <div class="maf-progress-container">
        <div id="mafProgressBar" class="maf-progress-bar"></div>
      </div>
      <div class="maf-scale">
        <span class="scale-item">0%</span>
        <span class="scale-item">50%</span>
        <span class="scale-item">100%</span>
      </div>
    </div>

    <div class="data-list">
      <div class="data-item">
        <span class="data-label">Pump1 Start</span>
        <span class="data-value">5000</span>
      </div>
      <div class="data-item">
        <span class="data-label">Pump1 Full</span>
        <span class="data-value">8000</span>
      </div>
      <div class="data-item">
        <span class="data-label">Ex Mode</span>
        <span class="data-value">AT</span>
      </div>
      <div class="data-item">
        <span class="data-label">Ex Valve</span>
        <span class="data-value">OFF</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-start">开始记录</button>
      <button class="btn-stop">停止记录</button>
    </div>

    <div class="status-bar">LIVE UPDATE: 100ms</div>
  </div>
</body>

  <script>

    let currentT = 0, currentD = 0;
    window.onload = function() { setInterval(fetchData, 100); };

    function fetchData() {
      var xhr = new XMLHttpRequest();
      xhr.onreadystatechange = function() {
        if (xhr.readyState==4 && xhr.status==200) updateUI(xhr.responseText);
      };
      xhr.open("GET","/getdata",true); xhr.send();
    }

    function updateUI(dataStr) {
      const arr = dataStr.split('|');
      if(arr.length!==5) return;
      const v=arr[0],t=arr[1],d=arr[2],m=parseInt(arr[3]),s=parseInt(arr[4]);

      document.getElementById('dispV').innerText = v+' mV';
      if(document.activeElement!==document.getElementById('inputT')) document.getElementById('inputT').value=t;
      if(document.activeElement!==document.getElementById('inputD')) document.getElementById('inputD').value=d;

      const sb=document.getElementById('statusBox');
      if(s===1) { sb.className='status-box status-on'; sb.innerText='VALVE: OPEN'; }
      else { sb.className='status-box status-off'; sb.innerText='VALVE: CLOSED'; }

      document.getElementById('btnM1').classList.remove('active');
      document.getElementById('btnM2').classList.remove('active');
      document.getElementById('btnM3').classList.remove('active');
      document.getElementById('btnM'+m).classList.add('active');
    }

    function sendCmd(cmd) {
      var xhr=new XMLHttpRequest(); xhr.open("GET","/set?cmd="+cmd,true); xhr.send();
    }
    function setMode(m) { sendCmd("M"+m); }
    function startRecord() {
      var x=new XMLHttpRequest(); x.open("GET","/startRecord",true); x.send();
    }
    function stopRecord() {
      var x=new XMLHttpRequest();
      x.onreadystatechange=function(){ if(x.readyState==4&&x.status==200) {
        let blob=new Blob([x.responseText],{type:'text/csv'});
        let url=window.URL.createObjectURL(blob);
        let a=document.createElement('a');
        a.href=url; a.download='mars_log.csv';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }};
      x.open("GET","/stopRecord",true); x.send();
    }
    // 方案一：全局进度条控制
    function setProgress(percent) {
      const bar = document.getElementById('progressBar');
      if (!bar) return;
      const p = Math.max(0, Math.min(100, percent));
      bar.style.width = p + '%';
    }

  </script>
</body>
</html>
